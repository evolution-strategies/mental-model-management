name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run deterministic dry-run
        run: python3 manager.py examples/es_input.md --mock --dry-run

